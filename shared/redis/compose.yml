name: redis
services:
  redis:
    container_name: redis
    image: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
      - ./config/redis-full.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    profiles:
      - only-redis
      - all
